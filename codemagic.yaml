workflows:
  tudor-ios:
    name: Tudor iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Tudor ASC Key
    environment:
      vars:
        BUNDLE_ID: "ch.tudorgentlemensbarber.app"
        APP_NAME: "Tudor Gentlemen's Barber"
      node: v22.0.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
          npm rebuild sharp
      - name: Add iOS platform
        script: |
          chmod +x ./node_modules/.bin/*
          node ./node_modules/@capacitor/cli/bin/capacitor add ios
      - name: Generate app icons
        script: npx @capacitor/assets generate --iconBackgroundColor '#0a0a0a' --iconBackgroundColorDark '#0a0a0a' --splashBackgroundColor '#0a0a0a' --splashBackgroundColorDark '#0a0a0a' --ios
      - name: Copy web assets
        script: npx cap copy ios
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/cert_key.pem
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
